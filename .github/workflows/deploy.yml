name: Deploy Housewarming Invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out invitation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check RSVP behavior
        run: |
          node --check script.js
          node --test tests/rsvp.test.cjs

      - name: Build standalone GitHub Pages site
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          mkdir -p dist/assets
          cp index.html styles.css script.js rsvp.js config.js robots.txt .nojekyll dist/
          python scripts/generate_assets.py
          test -s dist/assets/house-illustration.webp
          test -s dist/assets/folk-arch.webp
          test -s dist/index.html
          test -s dist/rsvp.js
          test -s dist/config.js
          test -s dist/styles.css
          test -s dist/script.js
          # Publish a complete mobile storybook with its two real assets.
          grep -q 'id="door-button"' dist/index.html
          grep -q 'id="postcard-rail"' dist/index.html
          grep -q 'id="rsvp-form"' dist/index.html


      - name: Keep artwork in the repository
        run: |
          if [ ! -s assets/house-illustration.webp ]; then
            mkdir -p assets
            cp dist/assets/* assets/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/
            git commit -m "Store housewarming artwork in GitHub" || true
            git push || echo "Art generation succeeded; saving sources will need a later commit."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4

